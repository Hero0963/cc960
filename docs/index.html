<script>
// cc960 — 象棋走法引擎（Node 驗算與瀏覽器演示共用）
//
// 這一層只負責「標準中國象棋的行棋規則」，與隨機開局完全無關：
// 換句話說，把 setup.js 拿掉、改用標準開局擺法，這個檔案就是一副普通象棋。
//
// 座標：col 0..8（紅方視角左→右，對應 a..i），row 0..9（row 0 = 紅方底線，row 9 = 黑方底線）
// 棋子：{ t: 'K|A|B|N|R|C|P', c: 0 紅 | 1 黑 }
//   K 將帥　A 士仕　B 象相　N 馬傌　R 車俥　C 炮包　P 兵卒

const RED = 0, BLACK = 1;

// 子力價值（僅供開局檢定的「虧不虧」比較，不是引擎評估值）
const VAL = { R: 9, C: 4.5, N: 4, B: 2, A: 2, P: 1, K: 1000 };

function emptyBoard() {
  return Array.from({ length: 10 }, () => Array(9).fill(null));
}

function inBoard(r, c) { return r >= 0 && r <= 9 && c >= 0 && c <= 8; }

function inPalace(r, c, color) {
  if (c < 3 || c > 5) return false;
  return color === RED ? (r >= 0 && r <= 2) : (r >= 7 && r <= 9);
}

function ownSide(r, color) { return color === RED ? r <= 4 : r >= 5; }

function findKing(bd, color) {
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
    const p = bd[r][c];
    if (p && p.t === 'K' && p.c === color) return [r, c];
  }
  return null;
}

// 產生 (r,c) 上棋子的偽合法走法（不含自將檢查）
function pseudoMoves(bd, r, c) {
  const p = bd[r][c];
  if (!p) return [];
  const mv = [];
  const push = (rr, cc) => {
    if (!inBoard(rr, cc)) return false;
    const q = bd[rr][cc];
    if (!q) { mv.push([rr, cc]); return true; }      // 空點可走、可續行
    if (q.c !== p.c) mv.push([rr, cc]);              // 敵子可吃
    return false;                                     // 有子擋路
  };
  const ORTH = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  if (p.t === 'K') {
    for (const [dr, dc] of ORTH) {
      const rr = r + dr, cc = c + dc;
      if (inPalace(rr, cc, p.c)) push(rr, cc);
    }
  } else if (p.t === 'A') {
    for (const dr of [-1, 1]) for (const dc of [-1, 1]) {
      const rr = r + dr, cc = c + dc;
      if (inPalace(rr, cc, p.c)) push(rr, cc);
    }
  } else if (p.t === 'B') {
    for (const dr of [-2, 2]) for (const dc of [-2, 2]) {
      const rr = r + dr, cc = c + dc;
      if (!inBoard(rr, cc) || !ownSide(rr, p.c)) continue;      // 不過河
      if (bd[r + dr / 2][c + dc / 2]) continue;                 // 塞象眼
      push(rr, cc);
    }
  } else if (p.t === 'N') {
    const J = [[2, 1], [2, -1], [-2, 1], [-2, -1], [1, 2], [1, -2], [-1, 2], [-1, -2]];
    for (const [dr, dc] of J) {
      const rr = r + dr, cc = c + dc;
      if (!inBoard(rr, cc)) continue;
      const lr = r + (Math.abs(dr) === 2 ? dr / 2 : 0);
      const lc = c + (Math.abs(dc) === 2 ? dc / 2 : 0);
      if (bd[lr][lc]) continue;                                 // 蹩馬腿
      push(rr, cc);
    }
  } else if (p.t === 'R') {
    for (const [dr, dc] of ORTH) {
      let rr = r + dr, cc = c + dc;
      while (inBoard(rr, cc) && push(rr, cc)) { rr += dr; cc += dc; }
    }
  } else if (p.t === 'C') {
    for (const [dr, dc] of ORTH) {
      let rr = r + dr, cc = c + dc, jumped = false;
      while (inBoard(rr, cc)) {
        const q = bd[rr][cc];
        if (!jumped) {
          if (!q) mv.push([rr, cc]);
          else jumped = true;                                   // 遇到砲架
        } else if (q) {
          if (q.c !== p.c) mv.push([rr, cc]);                   // 隔子吃
          break;
        }
        rr += dr; cc += dc;
      }
    }
  } else if (p.t === 'P') {
    const f = p.c === RED ? 1 : -1;
    push(r + f, c);
    if (!ownSide(r, p.c)) { push(r, c - 1); push(r, c + 1); }   // 過河後可橫走
  }
  return mv;
}

// color 方是否攻擊 (tr,tc)（不含照面規則）
function isAttacked(bd, tr, tc, color) {
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
    const p = bd[r][c];
    if (!p || p.c !== color) continue;
    for (const [rr, cc] of pseudoMoves(bd, r, c)) {
      if (rr === tr && cc === tc) return true;
    }
  }
  return false;
}

// 將帥是否照面（同路且中間無隔子）
function kingsFacing(bd) {
  const rk = findKing(bd, RED), bk = findKing(bd, BLACK);
  if (!rk || !bk || rk[1] !== bk[1]) return false;
  for (let r = rk[0] + 1; r < bk[0]; r++) if (bd[r][rk[1]]) return false;
  return true;
}

function inCheck(bd, color) {
  const k = findKing(bd, color);
  if (!k) return true;
  return isAttacked(bd, k[0], k[1], 1 - color) || kingsFacing(bd);
}

function makeMove(bd, r, c, rr, cc) {
  const nb = bd.map(row => row.slice());
  nb[rr][cc] = nb[r][c];
  nb[r][c] = null;
  return nb;
}

// color 方所有合法走法（排除自將、照面）
function legalMoves(bd, color) {
  const out = [];
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
    const p = bd[r][c];
    if (!p || p.c !== color) continue;
    for (const [rr, cc] of pseudoMoves(bd, r, c)) {
      const nb = makeMove(bd, r, c, rr, cc);
      if (!inCheck(nb, color)) out.push([r, c, rr, cc]);
    }
  }
  return out;
}

// ---------- 組合工具（setup.js 的編號系統會用到） ----------

// arr 中所有「取 2 個」的組合，字典序
function pairs(arr) {
  const out = [];
  for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) out.push([arr[i], arr[j]]);
  return out;
}

const C_PAIRS = pairs([0, 1, 2, 3, 4, 5, 6, 7, 8]);   // 炮的 36 種路組合

if (typeof module !== 'undefined') {
  module.exports = {
    RED, BLACK, VAL,
    emptyBoard, inBoard, inPalace, ownSide, findKing,
    pseudoMoves, isAttacked, kingsFacing, inCheck, makeMove, legalMoves,
    pairs, C_PAIRS,
  };
}

</script>
<script>
// cc960 — 隨機開局擺位產生器（規格 v4）
//
// 三條結構規則：
//   一、紅黑「點對稱」：黑方 = 紅方旋轉 180°（紅 (r,c) ↔ 黑 (9-r, 8-c)）。
//       從各自座位看，雙方陣形一模一樣（紅「一路」兵進 ↔ 黑「1路」卒進，不是同一 column）。
//   二、象限定「原軌道」5 點（底線與宮頂線；v4 收掉河沿，見 spec.md §1）。
//   三、兵各路獨立，可原位或前進一格（每方 2^5 = 32 種兵形）。
// 檢定（quietStartCheck）：任一首著吃子須「有根且不虧」或「對稱可回應」。
//
// 依賴 rules.js 的走法引擎：Node 用 require 注入全域；瀏覽器中兩份 <script> 本就共享全域詞法環境。
// 完整規格與推導見 docs/spec.md。

if (typeof module !== 'undefined' && typeof RED === 'undefined') {
  Object.assign(globalThis, require('./rules.js'));
}

// 紅方象的原軌道 5 點 [row, col]：c1,g1（底線）、a3,e3,i3（宮頂線）
// v4 拿掉河沿 c5,g5——河頭象實戰極罕見，且實測對平衡率毫無影響（spec.md §1）
const E_POINTS = [[0, 2], [0, 6], [2, 0], [2, 4], [2, 8]];
const E_PAIRS = [];
for (let i = 0; i < E_POINTS.length; i++)
  for (let j = i + 1; j < E_POINTS.length; j++) E_PAIRS.push([i, j]);
const BACK_ALL = [0, 1, 2, 6, 7, 8];   // 底線非九宮路 a,b,c,g,h,i
const PAWN_FILES = [0, 2, 4, 6, 8];    // 兵的 5 路 a,c,e,g,i

// 依象位分組的混合基數編號：每組大小 = C(m,2) 馬 × C(m-2,2) 車 × 36 炮 × 32 兵形
// （m = 扣掉底線象位後、底線還剩幾路可放車馬）
const GROUPS = E_PAIRS.map(([i, j]) => {
  const pts = [E_POINTS[i], E_POINTS[j]];
  const backOcc = pts.filter(p => p[0] === 0).map(p => p[1]);
  const backAvail = BACK_ALL.filter(f => !backOcc.includes(f));
  const hPairs = pairs(backAvail);
  const m = backAvail.length;
  const rBase = (m - 2) * (m - 3) / 2;
  return { pts, backAvail, hPairs, rBase, hrBase: hPairs.length * rBase, size: hPairs.length * rBase * 36 * 32 };
});
const OFFSETS = [];
{ let acc = 0; for (const g of GROUPS) { OFFSETS.push(acc); acc += g.size; } }
const RAW_TOTAL = OFFSETS[OFFSETS.length - 1] + GROUPS[GROUPS.length - 1].size;  // 525,312

// 編號 → 擺位描述；越界回 null
function decodeId(id) {
  if (id < 0 || id >= RAW_TOTAL) return null;
  let gi = GROUPS.length - 1;
  while (OFFSETS[gi] > id) gi--;
  const g = GROUPS[gi];
  let rem = id - OFFSETS[gi];
  const pMask = rem % 32; rem = Math.floor(rem / 32);
  const cIdx = rem % 36; rem = Math.floor(rem / 36);
  const rIdx = rem % g.rBase;
  const hIdx = Math.floor(rem / g.rBase);
  const hFiles = g.hPairs[hIdx];
  const rem2 = g.backAvail.filter(f => !hFiles.includes(f));
  const rFiles = pairs(rem2)[rIdx];
  return { ePts: g.pts, hFiles, rFiles, cFiles: C_PAIRS[cIdx], pMask };
}

// 編號 → 局面；結構衝突（炮疊上宮頂線的象）回 null
// v4 象不再上河沿，兵與象不可能撞位，故只剩炮這一種衝突
function setupFromId(id) {
  const d = decodeId(id);
  if (!d) return null;
  const eKey = new Set(d.ePts.map(p => p[0] * 9 + p[1]));
  for (const f of d.cFiles) if (eKey.has(2 * 9 + f)) return null;           // 炮撞象（宮頂線）
  const bd = emptyBoard();
  for (const col of [RED, BLACK]) {
    // 點對稱：黑方 = 紅方旋轉 180°
    const put = (t, r, c) => {
      if (col === RED) bd[r][c] = { t, c: col };
      else bd[9 - r][8 - c] = { t, c: col };
    };
    put('K', 0, 4); put('A', 0, 3); put('A', 0, 5);
    for (const [r, c] of d.ePts) put('B', r, c);
    for (const f of d.hFiles) put('N', 0, f);
    for (const f of d.rFiles) put('R', 0, f);
    for (const f of d.cFiles) put('C', 2, f);
    for (let i = 0; i < 5; i++) put('P', ((d.pMask >> i) & 1) ? 4 : 3, PAWN_FILES[i]);
  }
  return bd;
}

// side 方所有「合法的首著吃子」（只生吃子著法、個別驗自將——比全合法著法快一個量級）
function legalCaptures(bd, side) {
  const out = [];
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
    const p = bd[r][c];
    if (!p || p.c !== side) continue;
    for (const [rr, cc] of pseudoMoves(bd, r, c)) {
      if (!bd[rr][cc]) continue;
      if (!inCheck(makeMove(bd, r, c, rr, cc), side)) out.push([r, c, rr, cc]);
    }
  }
  return out;
}

// 首著靜置檢定：
// (a) 開局即照面或被將 → 不合法
// (b) 任一首著吃子若非「有根且不虧」（吃後可被反吃、且被吃子價值 ≤ 出手子價值），
//     也非「對稱可回應」（吃完後對方仍能走點對稱的對應著吃回同型子）→ 不合法
function quietStartCheck(bd) {
  if (kingsFacing(bd)) return { ok: false, why: 'facing' };
  if (inCheck(bd, RED) || inCheck(bd, BLACK)) return { ok: false, why: 'check' };
  for (const side of [RED, BLACK]) {
    for (const [r, c, rr, cc] of legalCaptures(bd, side)) {
      const victim = bd[rr][cc], attacker = bd[r][c];
      const after = makeMove(bd, r, c, rr, cc);
      const defended = isAttacked(after, rr, cc, 1 - side);
      if (defended && VAL[victim.t] <= VAL[attacker.t]) continue;   // 有根且不虧
      let symOK = false;                                            // 對稱可回應？（點對稱）
      const o = after[9 - r][8 - c], t = after[9 - rr][8 - cc];
      if (o && o.c === 1 - side && o.t === attacker.t && t && t.c === side && t.t === victim.t
          && pseudoMoves(after, 9 - r, 8 - c).some(m => m[0] === 9 - rr && m[1] === 8 - cc)
          && !inCheck(makeMove(after, 9 - r, 8 - c, 9 - rr, 8 - cc), 1 - side)) symOK = true;
      if (!symOK) return {
        ok: false, why: defended ? 'winning-capture' : 'free-capture',
        detail: { side, r, c, rr, cc, a: attacker.t, v: victim.t },
      };
    }
  }
  return { ok: true };
}

// 一站式判定：編號 → { ok, why? }
function checkId(id) {
  const bd = setupFromId(id);
  if (!bd) return { ok: false, why: 'structural' };
  return quietStartCheck(bd);
}

// 標準開局編號：象{c1,g1}=組 0、馬{b,h}、車{a,i}、炮{b,h}=cIdx 13、兵全原位
const STANDARD_ID = (3 * 36 + 13) * 32; // = 3872（組 0 內 hIdx 3、rIdx 0）

// 輕量版：組 0（象 c1,g1）＋兵全原位 ＝ 只隨機車馬炮的子集（216 局，全數合法）
function liteCandidates() {
  const out = [];
  const g = GROUPS[0];
  for (let hr = 0; hr < g.hrBase; hr++)
    for (let cI = 0; cI < 36; cI++)
      out.push(OFFSETS[0] + (hr * 36 + cI) * 32);
  return out;
}

// ===== 勾選式產生器：逐棋種決定「隨機」或「固定在標準開局位置」 =====
// sel = { e, n, r, c, p }，true 表示該棋種隨機擺放，false 表示釘在標準開局的位置：
//   象 c1/g1、馬 b/h、車 a/i、炮 b/h、兵全原位。五個軸互相獨立，共 32 種組合。
// 這五個位置在任何象位組下都取得到，因此每一種組合都必定含標準開局（編號 3872）。

const SUBSET_STD = { hPair: [1, 7], rPair: [0, 8], cIdx: 13, pMask: 0 };
const eqPair = (a, b) => a[0] === b[0] && a[1] === b[1];

// 某個軸可取的索引；不隨機時只回標準開局那一個（找不到回空陣列）
function axisIdxs(isFree, list, stdPair) {
  if (isFree) return list.map((_, i) => i);
  const i = list.findIndex(p => eqPair(p, stdPair));
  return i < 0 ? [] : [i];
}

// 象位組 × 馬 × 車 的所有組合（最多數百筆）。炮與兵在其上各自展開，
// 且每個三元組展開出的局面數都一樣，故「均勻抽三元組」＝「均勻抽局面」。
function subsetTriples(sel) {
  const out = [];
  for (const gi of (sel.e ? GROUPS.map((_, i) => i) : [0])) {
    const g = GROUPS[gi];
    for (const hIdx of axisIdxs(sel.n, g.hPairs, SUBSET_STD.hPair)) {
      const rPairs = pairs(g.backAvail.filter(f => !g.hPairs[hIdx].includes(f)));
      for (const rIdx of axisIdxs(sel.r, rPairs, SUBSET_STD.rPair)) out.push([gi, hIdx, rIdx]);
    }
  }
  return out;
}

// 三元組 → 該象位組宮頂線上的象所占的路（炮不可疊上去）
const cannonBlocked = gi => GROUPS[gi].pts.filter(p => p[0] === 2).map(p => p[1]);

// 某象位組下，炮還剩幾種擺法（扣掉疊上宮頂線象的組合）
function cannonOptions(gi, free) {
  const blocked = cannonBlocked(gi);
  const out = [];
  for (let cIdx = 0; cIdx < 36; cIdx++) {
    if (!free && cIdx !== SUBSET_STD.cIdx) continue;
    if (C_PAIRS[cIdx].some(f => blocked.includes(f))) continue;
    out.push(cIdx);
  }
  return out;
}

// 候選筆數，不實際生成——決定「要不要全枚舉」時用，避免為了數數就配置幾十萬筆陣列
function subsetCount(sel) {
  let n = 0;
  for (const [gi] of subsetTriples(sel)) n += cannonOptions(gi, sel.c).length * (sel.p ? 32 : 1);
  return n;
}

// 勾選式候選編號。**在生成階段就跳過結構衝突**（不再「先生成再丟」），
// 因此回傳的都擺得出來；是否通過首著靜置檢定仍由呼叫端用 checkId 過濾。
function subsetCandidates(sel) {
  const out = [];
  for (const [gi, hIdx, rIdx] of subsetTriples(sel)) {
    const base = OFFSETS[gi] + (hIdx * GROUPS[gi].rBase + rIdx) * 36 * 32;
    for (const cIdx of cannonOptions(gi, sel.c)) {
      for (let pMask = 0; pMask < 32; pMask++) {
        if (!sel.p && pMask !== SUBSET_STD.pMask) continue;
        out.push(base + cIdx * 32 + pMask);
      }
    }
  }
  return out;
}

// 即抽即驗：候選太多不值得全枚舉時用。同樣跳過結構衝突，只靠檢定重抽。
function randomSubsetId(sel) {
  const tri = subsetTriples(sel);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  for (;;) {
    const [gi, hIdx, rIdx] = pick(tri);
    const blocked = cannonBlocked(gi);
    const cIdx = sel.c ? Math.floor(Math.random() * 36) : SUBSET_STD.cIdx;
    if (C_PAIRS[cIdx].some(f => blocked.includes(f))) continue;
    const pMask = sel.p ? Math.floor(Math.random() * 32) : SUBSET_STD.pMask;
    const id = OFFSETS[gi] + ((hIdx * GROUPS[gi].rBase + rIdx) * 36 + cIdx) * 32 + pMask;
    if (checkId(id).ok) return id;
  }
}

// ===== 衍生版本：平衡版（引擎驗證）=====
// 輕量版 216 局全部餵給 Pikafish 2026-01-02（UCI，NNUE），固定 depth 40、單執行緒、
// 置換表 1024 MB、MultiPV 1，逐局取紅方先手優勢；保留 |評估| ≤ 40 釐兵者共 70 局。
// 40 釐兵的量尺意義：Pikafish 的評估已正規化到勝率，100 釐兵 ≈ 50% 勝率，
// 故 40 釐兵約當「紅方勝率 11% 上下」——與標準開局（18 釐兵）同一級距。
// 驗證日期 2026-07-25；方法與完整分布見 docs/spec.md §8。
// 此表是實測結果，不是算出來的：改動擺法規則或檢定後必須重新評估。
const BALANCED_IDS = [
  0, 192, 256, 352, 448, 992, 1056, 1120,
  1152, 1216, 1344, 1408, 1440, 1536, 1600, 1728,
  1760, 2208, 3488, 3520, 3552, 3584, 3616, 3648,
  3680, 3712, 3744, 3776, 3808, 3840, 3872, 3904,
  3936, 3968, 4000, 4032, 4064, 4096, 4128, 4160,
  4192, 4224, 4256, 4288, 4320, 4352, 4384, 4416,
  4448, 4480, 4512, 4544, 4800, 4864, 4992, 5056,
  5184, 5216, 5344, 5568, 5600, 5664, 5728, 5952,
  6016, 6048, 6080, 6208, 6528, 6816,
];

function balancedCandidates() {
  return BALANCED_IDS.slice();
}

// ===== 衍生版本：軸對稱版 =====
// 加一條限制：每方自身以中線（e 路）左右對稱；此時黑方「旋轉」與「翻面」結果相同，棋形如標準棋端正。
// 象取對稱點對、馬車炮取對稱路對、兵進格 a=i、c=g、中兵獨立。檢定沿用同一套 quietStartCheck。

const SYM_E_PAIRS = [[0, 1], [2, 4]];                      // E_POINTS 索引：{c1,g1}{a3,i3}（v4 起無 {c5,g5}）
const SYM_BACK_PAIRS = [[0, 8], [1, 7], [2, 6]];           // 底線對稱路對 {a,i}{b,h}{c,g}
const SYM_CANNON_PAIRS = [[0, 8], [1, 7], [2, 6], [3, 5]]; // 炮對稱路對 {a,i}{b,h}{c,g}{d,f}
const SYM_PMASKS = [];                                      // 對稱兵形：bit 序 a,c,e,g,i
for (let s = 0; s < 8; s++) {
  SYM_PMASKS.push((s & 1 ? 0b10001 : 0) | (s & 2 ? 0b01010 : 0) | (s & 4 ? 0b00100 : 0));
}
const eq2 = (a, b) => a[0] === b[0] && a[1] === b[1];

// 全部軸對稱候選（以編號表示；含結構衝突者，交由 checkId 過濾）
function symCandidates() {
  const out = [];
  for (const ePair of SYM_E_PAIRS) {
    const eIdx = E_PAIRS.findIndex(p => eq2(p, ePair));
    const g = GROUPS[eIdx];
    for (const hPair of SYM_BACK_PAIRS) {
      const hIdx = g.hPairs.findIndex(p => eq2(p, hPair));
      if (hIdx < 0) continue;                                // 該路對被底線象佔用
      const rem = g.backAvail.filter(f => !hPair.includes(f));
      const rPairs = pairs(rem);
      for (const rPair of SYM_BACK_PAIRS) {
        if (eq2(rPair, hPair)) continue;
        const rIdx = rPairs.findIndex(p => eq2(p, rPair));
        if (rIdx < 0) continue;
        for (const cPair of SYM_CANNON_PAIRS) {
          const cIdx = C_PAIRS.findIndex(p => eq2(p, cPair));
          for (const mask of SYM_PMASKS) {
            out.push(OFFSETS[eIdx] + ((hIdx * g.rBase + rIdx) * 36 + cIdx) * 32 + mask);
          }
        }
      }
    }
  }
  return out.sort((a, b) => a - b);
}

// ===== 局面的字串表示：象棋 FEN =====
// 第一段自黑方底線（row 9）寫到紅方底線（row 0），每列 col 0→8（file a→i）；紅方大寫、黑方小寫。
// 第 3/4 欄（吃過路兵、王車易位）象棋無意義但不可省；第 5 欄是 rule60 計數，≥120 會被 Pikafish 拒收。
// 產出與公認 ground truth 逐字相符，且 Pikafish 2026-01-02 零拒收（見 spec.md §8）。
function toFen(bd) {
  const rows = [];
  for (let r = 9; r >= 0; r--) {
    let line = '', empty = 0;
    for (let c = 0; c <= 8; c++) {
      const p = bd[r][c];
      if (!p) { empty++; continue; }
      if (empty) { line += empty; empty = 0; }
      line += p.c === RED ? p.t : p.t.toLowerCase();
    }
    if (empty) line += empty;
    rows.push(line);
  }
  return rows.join('/') + ' w - - 0 1';
}

if (typeof module !== 'undefined') {
  module.exports = {
    E_POINTS, E_PAIRS, BACK_ALL, PAWN_FILES, GROUPS, OFFSETS, RAW_TOTAL,
    decodeId, setupFromId, legalCaptures, quietStartCheck, checkId, toFen,
    STANDARD_ID, liteCandidates, symCandidates, balancedCandidates, BALANCED_IDS,
    subsetTriples, subsetCount, subsetCandidates, randomSubsetId,
  };
}

</script>
<script>
// cc960 — 生成器頁的互動層（棋盤 SVG 繪製、勾選式產生器、FEN 與連結分享）
// 只依賴 rules.js 與 setup.js 的全域函式；無任何外部函式庫。
// 本頁只產生開局，不提供行棋——走法引擎仍在，供局面檢定與 FEN 使用。
(function () {
  'use strict';

  const CELL = 54, MARGIN = 34, NS = 'http://www.w3.org/2000/svg';
  const X = c => MARGIN + c * CELL;
  const Y = r => MARGIN + (9 - r) * CELL;
  const FILES = 'abcdefghi';
  const PIECE_CH = [
    { K: '帥', A: '仕', B: '相', N: '傌', R: '俥', C: '炮', P: '兵' },
    { K: '將', A: '士', B: '象', N: '馬', R: '車', C: '包', P: '卒' },
  ];
  const PIECE_FONT = '"DFKai-SB","BiauKai","Kaiti TC","KaiTi","Noto Serif TC",serif';
  const REASON = {
    structural: '結構衝突（炮疊上宮頂線的象）',
    'free-capture': '首著可白吃且對稱不可回應',
    'winning-capture': '首著可低值吃高值',
    facing: '開局照面', check: '開局被將',
  };

  const $ = id => document.getElementById(id);
  const svg = $('board');

  // --- 勾選式產生器 ---
  const AXES = ['e', 'n', 'r', 'c', 'p'];
  const AXIS_LABEL = { e: '象', n: '馬', r: '車', c: '炮', p: '兵' };
  const FIXED_AT = { e: 'c1/g1', n: 'b/h', r: 'a/i', c: 'b/h', p: '全原位' };
  // 候選超過此數就不全枚舉、改即抽即驗：實測 4 萬多筆的枚舉＋檢定約 0.7 秒，全勾的 35 萬筆約 10 秒
  const ENUM_LIMIT = 60000;

  const S = { id: STANDARD_ID, sel: null };
  const poolCache = {};                       // 勾選組合 → 合法編號清單（null ＝ 該組合不枚舉）

  const readSel = () => AXES.reduce((s, a) => (s[a] = $('ck-' + a).checked, s), {});
  const selKey = sel => AXES.map(a => sel[a] ? '1' : '0').join('');

  function poolFor(sel) {
    const key = selKey(sel);
    if (!(key in poolCache)) {
      poolCache[key] = subsetCount(sel) > ENUM_LIMIT
        ? null
        : subsetCandidates(sel).filter(id => checkId(id).ok);
    }
    return poolCache[key];
  }

  function el(name, attrs, text) {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  // --- 棋盤靜態層 ---
  function drawStatic(g) {
    g.appendChild(el('rect', { x: 0, y: 0, width: 500, height: 554, rx: 6, fill: 'var(--board)', stroke: 'var(--board-edge)', 'stroke-width': 3 }));
    g.appendChild(el('rect', { x: MARGIN - 7, y: MARGIN - 7, width: 8 * CELL + 14, height: 9 * CELL + 14, fill: 'none', stroke: 'var(--board-line)', 'stroke-width': 2.5 }));
    const line = (x1, y1, x2, y2, w) => g.appendChild(el('line', { x1, y1, x2, y2, stroke: 'var(--board-line)', 'stroke-width': w || 1.2 }));
    for (let r = 0; r <= 9; r++) line(X(0), Y(r), X(8), Y(r));
    for (let c = 0; c <= 8; c++) {
      if (c === 0 || c === 8) line(X(c), Y(0), X(c), Y(9));
      else { line(X(c), Y(0), X(c), Y(4)); line(X(c), Y(5), X(c), Y(9)); }
    }
    for (const [r1, r2] of [[0, 2], [9, 7]]) {
      line(X(3), Y(r1), X(5), Y(r2)); line(X(5), Y(r1), X(3), Y(r2));
    }
    const ym = (Y(4) + Y(5)) / 2;
    for (const [t, x] of [['楚 河', X(2)], ['漢 界', X(6)]]) {
      g.appendChild(el('text', {
        x, y: ym, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        fill: 'var(--board-line)', 'font-size': 24, 'letter-spacing': '8',
        'font-family': PIECE_FONT, opacity: .85,
      }, t));
    }
    const mark = (r, c) => {
      const x = X(c), y = Y(r), d = 5, o = 8, p = [];
      if (c > 0) p.push(`M${x - o - d} ${y - o} h${d} v${-d}`, `M${x - o - d} ${y + o} h${d} v${d}`);
      if (c < 8) p.push(`M${x + o + d} ${y - o} h${-d} v${-d}`, `M${x + o + d} ${y + o} h${-d} v${d}`);
      g.appendChild(el('path', { d: p.join(' '), fill: 'none', stroke: 'var(--board-line)', 'stroke-width': 1.2 }));
    };
    for (const c of [0, 2, 4, 6, 8]) { mark(3, c); mark(6, c); }
    for (let c = 0; c <= 8; c++) g.appendChild(el('text', { x: X(c), y: 554 - 8, 'text-anchor': 'middle', fill: 'var(--board-line)', 'font-size': 11, opacity: .7 }, FILES[c]));
    for (let r = 0; r <= 9; r++) g.appendChild(el('text', { x: 12, y: Y(r) + 4, 'text-anchor': 'middle', fill: 'var(--board-line)', 'font-size': 11, opacity: .7 }, String(r + 1)));
  }

  // --- 全盤重繪 ---
  function render() {
    const bd = setupFromId(S.id);
    svg.textContent = '';
    const g = el('g', {});
    drawStatic(g);
    for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
      const p = bd[r][c];
      if (!p) continue;
      const pg = el('g', { class: 'piece' });
      pg.appendChild(el('circle', { cx: X(c), cy: Y(r), r: 23, fill: 'var(--piece-face)', stroke: 'var(--piece-rim)', 'stroke-width': 1.5 }));
      const tone = p.c === RED ? 'var(--red)' : 'var(--black-piece)';
      pg.appendChild(el('circle', { cx: X(c), cy: Y(r), r: 19.5, fill: 'none', stroke: tone, 'stroke-width': 1, opacity: .75 }));
      pg.appendChild(el('text', {
        x: X(c), y: Y(r), 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-size': 26, 'font-family': PIECE_FONT, 'font-weight': 700, fill: tone,
      }, PIECE_CH[p.c][p.t]));
      g.appendChild(pg);
    }
    svg.appendChild(g);
    $('info-id').textContent = S.id;
    $('fen').textContent = toFen(bd);
  }

  function renderPoolNote() {
    const list = poolFor(S.sel);
    const on = AXES.filter(a => S.sel[a]), off = AXES.filter(a => !S.sel[a]);
    // 勾了卻完全不影響結果的軸要標出來，否則使用者勾了看不出差別會以為壞掉。
    // 例：象釘 c1/g1、車釘 a/i 時，底線只剩 b/h 給馬——勾「馬」也沒得選。
    const total = subsetCount(S.sel);
    const isDead = a => subsetCount(Object.assign({}, S.sel, { [a]: false })) === total;
    let t = on.length
      ? '隨機：' + on.map(a => AXIS_LABEL[a] + (isDead(a) ? '（此設定下無可選位置）' : '')).join('、')
      : '五種棋子全部固定';
    if (off.length) t += '｜固定：' + off.map(a => AXIS_LABEL[a] + ' ' + FIXED_AT[a]).join('、');
    $('pool-note').textContent = t + (list ? '　→ 此組合共 ' + list.length + ' 局' : '　→ 局面太多，隨機時即抽即驗');
  }

  // --- 局面載入 ---
  function loadId(id, note) {
    S.id = id;
    $('posid').value = id;
    $('gen-note').textContent = note || '';
    $('gen-note').className = note ? 'gen-note warn' : 'gen-note';
    $('copy-note').textContent = '';
    // file:// 下瀏覽器會擋 replaceState（來源為 null），失敗就算了，不影響其他功能
    try { history.replaceState(null, '', location.pathname + '?id=' + id); } catch (e) { /* 忽略 */ }
    render();
  }

  // --- 分享 ---
  const shareLink = () => location.href.split('#')[0].split('?')[0] + '?id=' + S.id;

  function copyText(text, label) {
    const say = ok => { $('copy-note').textContent = ok ? label + '已複製' : '無法自動複製，請手動選取'; };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      say(ok);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => say(true), fallback);
    } else fallback();
  }

  // --- 控制列 ---
  $('btn-random').addEventListener('click', () => {
    const list = poolFor(S.sel);
    loadId(list ? list[Math.floor(Math.random() * list.length)] : randomSubsetId(S.sel));
  });
  $('btn-standard').addEventListener('click', () => loadId(STANDARD_ID));

  function gotoInput() {
    const n = parseInt($('posid').value, 10);
    const id = Math.max(0, Math.min(RAW_TOTAL - 1, isNaN(n) ? 0 : n));
    const res = checkId(id);
    if (res.ok) { loadId(id); return; }
    let next = id;                            // 往後找最近的合法編號（循環）
    do { next = (next + 1) % RAW_TOTAL; } while (!checkId(next).ok);
    loadId(next, '編號 ' + id + ' 不合法（' + (REASON[res.why] || res.why) + '），已跳至最近的合法編號 ' + next);
  }
  $('btn-goto').addEventListener('click', gotoInput);
  $('posid').addEventListener('keydown', ev => { if (ev.key === 'Enter') gotoInput(); });

  $('btn-copy-fen').addEventListener('click', () => copyText($('fen').textContent, 'FEN '));
  $('btn-copy-link').addEventListener('click', () => copyText(shareLink(), '連結'));

  for (const a of AXES) {
    $('ck-' + a).addEventListener('change', () => { S.sel = readSel(); renderPoolNote(); });
  }

  // --- 開場 ---
  // 網址帶 ?id= 就載入該局（方便分享），否則用標準開局，讓「跟標準只差在哪」一目瞭然
  function initialId() {
    const m = /[?&]id=(\d+)/.exec(location.search || '');
    if (!m) return STANDARD_ID;
    const id = Number(m[1]);
    return (id < RAW_TOTAL && checkId(id).ok) ? id : STANDARD_ID;
  }
  $('posid').max = RAW_TOTAL - 1;
  S.sel = readSel();
  renderPoolNote();
  loadId(initialId());
})();

</script>

</body>
</html>
