<title>cc960 隨機開局生成器</title>
<style>
  :root {
    --paper: #faf6ee;        /* 暖紙色底 */
    --ink: #2b2118;          /* 墨色文字 */
    --ink-muted: #7a6a58;
    --board: #e9cf9b;        /* 棋盤木色 */
    --board-line: #6b5233;   /* 盤線 */
    --board-edge: #8a6a40;
    --piece-face: #f7eed9;   /* 棋子牙白 */
    --piece-rim: #c9b48d;
    --red: #b03a2e;          /* 朱紅（紅方） */
    --black-piece: #26201a;  /* 黑方墨字 */
    --accent: #35507a;       /* 靛青（UI 互動色，避開棋子紅） */
    --accent-soft: #dfe7f2;
    --panel: #f2ebdd;
    --panel-border: #d9cbb2;
    --good: #2c6e49;
    --warn: #a63c06;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17120d; --ink: #e8ddcc; --ink-muted: #a08e77;
      --board: #43331f; --board-line: #c4a771; --board-edge: #2c2113;
      --piece-face: #efe3c8; --piece-rim: #8a744f;
      --red: #e05a4b; --black-piece: #211a12;
      --accent: #8fb0dd; --accent-soft: #26344a;
      --panel: #201810; --panel-border: #3d3020;
      --good: #7cc29a; --warn: #f0946a;
    }
  }
  :root[data-theme="dark"] {
    --paper: #17120d; --ink: #e8ddcc; --ink-muted: #a08e77;
    --board: #43331f; --board-line: #c4a771; --board-edge: #2c2113;
    --piece-face: #efe3c8; --piece-rim: #8a744f;
    --red: #e05a4b; --black-piece: #211a12;
    --accent: #8fb0dd; --accent-soft: #26344a;
    --panel: #201810; --panel-border: #3d3020;
    --good: #7cc29a; --warn: #f0946a;
  }
  :root[data-theme="light"] {
    --paper: #faf6ee; --ink: #2b2118; --ink-muted: #7a6a58;
    --board: #e9cf9b; --board-line: #6b5233; --board-edge: #8a6a40;
    --piece-face: #f7eed9; --piece-rim: #c9b48d;
    --red: #b03a2e; --black-piece: #26201a;
    --accent: #35507a; --accent-soft: #dfe7f2;
    --panel: #f2ebdd; --panel-border: #d9cbb2;
    --good: #2c6e49; --warn: #a63c06;
  }
  body { background: var(--paper); color: var(--ink);
         font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
         margin: 0; line-height: 1.6; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px;
           border-bottom: 2px solid var(--panel-border); padding-bottom: 12px; margin-bottom: 18px; }
  h1 { font-family: "Source Han Serif TC", "Noto Serif TC", "PMingLiU", serif;
       font-size: 1.7rem; margin: 0; letter-spacing: .06em; }
  h1 .num { color: var(--red); }
  .tagline { color: var(--ink-muted); font-size: .92rem; }
  a { color: var(--accent); }
  .layout { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .board-col { flex: 0 1 520px; min-width: 300px; }
  .side-col { flex: 1 1 320px; min-width: 280px; display: flex; flex-direction: column; gap: 14px; }
  svg { width: 100%; height: auto; display: block; border-radius: 6px;
        box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .panel { background: var(--panel); border: 1px solid var(--panel-border);
           border-radius: 8px; padding: 14px 16px; }
  .panel h2 { font-size: .8rem; letter-spacing: .18em; text-transform: uppercase;
              color: var(--ink-muted); margin: 0 0 10px; font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls + .controls { margin-top: 8px; }
  button { font: inherit; font-size: .92rem; padding: 7px 14px; border-radius: 6px;
           border: 1px solid var(--panel-border); background: var(--paper); color: var(--ink);
           cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
  input[type="number"] { font: inherit; font-size: .92rem; padding: 6px 8px;
    border-radius: 6px; border: 1px solid var(--panel-border); background: var(--paper); color: var(--ink);
    width: 120px; font-variant-numeric: tabular-nums; }
  .pieces { font-size: .92rem; }
  .pieces .lead { color: var(--ink-muted); }
  .pieces label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
                  padding: 3px 8px 3px 5px; border: 1px solid var(--panel-border);
                  border-radius: 6px; background: var(--paper); }
  .pieces label:hover { border-color: var(--accent); }
  .pieces input { accent-color: var(--accent); margin: 0; }
  .pieces label.wide { font-weight: 600; }
  .eval { color: var(--good); font-weight: 600; }
  .posinfo { font-size: .92rem; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .posinfo b { color: var(--accent); font-size: 1.05rem; }
  .gen-note { font-size: .85rem; color: var(--ink-muted); min-height: 1.4em; margin-top: 4px; }
  .gen-note.warn { color: var(--warn); }
  .fen { font-family: "Cascadia Mono", "Consolas", "DejaVu Sans Mono", monospace;
         font-size: .82rem; word-break: break-all; background: var(--paper);
         border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px 10px;
         margin-bottom: 8px; user-select: all; }
  .copy-note { font-size: .85rem; color: var(--good); min-height: 1.4em; margin-top: 4px; }
  .muted { color: var(--ink-muted); }
  footer { margin-top: 28px; color: var(--ink-muted); font-size: .85rem;
           border-top: 1px solid var(--panel-border); padding-top: 10px; }
</style>

<div class="wrap">
  <header>
    <h1>cc960 <span class="num">隨機開局生成器</span></h1>
    <span class="tagline">借鑑 Chess960 的中國象棋：走法完全不變，只隨機開局擺放</span>
  </header>

  <div class="layout">
    <div class="board-col">
      <svg id="board" viewBox="0 0 500 554" role="img" aria-label="象棋棋盤"></svg>
    </div>

    <div class="side-col">
      <div class="panel">
        <h2>開局產生器</h2>
        <div class="controls pieces">
          <span class="lead">隨機哪些棋種：</span>
          <label><input type="checkbox" id="ck-e" checked> 象</label>
          <label><input type="checkbox" id="ck-n" checked> 馬</label>
          <label><input type="checkbox" id="ck-r" checked> 車</label>
          <label><input type="checkbox" id="ck-c" checked> 炮</label>
          <label><input type="checkbox" id="ck-p" checked> 兵</label>
        </div>
        <div class="controls pieces">
          <label class="wide"><input type="checkbox" id="ck-balanced"> 只給引擎驗證過的平衡盤面</label>
        </div>
        <div class="gen-note" id="pool-note"></div>
        <div class="controls">
          <button class="primary" id="btn-random">🎲 隨機一局</button>
          <button id="btn-standard">標準開局</button>
        </div>
        <div class="controls">
          <label for="posid">跳至編號</label>
          <input type="number" id="posid" min="0" value="0">
          <button id="btn-goto">跳轉</button>
        </div>
        <div class="gen-note" id="gen-note"></div>
      </div>

      <div class="panel">
        <h2>這一局</h2>
        <div class="posinfo">編號 <b id="info-id">–</b> <span id="info-eval"></span></div>
        <div class="fen" id="fen">–</div>
        <div class="controls">
          <button id="btn-copy-fen">複製 FEN</button>
          <button id="btn-copy-link">複製連結</button>
        </div>
        <div class="copy-note" id="copy-note"></div>
        <p class="muted" style="font-size:.85rem;margin:8px 0 0">
          FEN 是象棋界通用的局面字串，可直接貼進象棋軟體或引擎。連結會帶上編號，對方打開就是同一局。<br>
          「引擎實測先手優勢」只有那 280 局驗證過的盤面才會顯示：Pikafish 2026-01-02 固定深度 40 的評估值，
          100 釐兵約當五成勝率，所以 40 釐兵以內大致等於「紅方勝率一成上下」，與標準開局（18 釐兵）同級。
        </p>
      </div>
    </div>
  </div>

  <footer>
    <a href="https://github.com/Hero0963/cc960">github.com/Hero0963/cc960</a> · MIT License
  </footer>
</div>
